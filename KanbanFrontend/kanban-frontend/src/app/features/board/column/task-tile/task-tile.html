<div class="task-tile" (click)="onTileClick()" [ngStyle]="{ 'border-color': typeColor() }">
    <div class="task-header">
        <h6>{{ thisTask().title }}</h6>
        <div class="tags">
            @for (tag of thisTask().tags; track tag.id) {
                <app-tag [thisTag]="tag" />
            }
        </div>
    </div>
    <div class="task-body">
        <p>{{ thisTask().description }}</p>
    </div>
    <div class="task-footer">
        <span class="type" [ngStyle]="{ color: typeColor() }">{{ thisTask().type.name }}</span>
        <span class="date">{{ thisTask().createdAt | date: 'shortDate' }}</span>
    </div>
</div>
