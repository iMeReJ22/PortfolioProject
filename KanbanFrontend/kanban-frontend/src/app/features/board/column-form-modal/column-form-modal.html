<div class="modal-overlay" (click)="closeCreateColumnModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>{{ columnToEditId() === null ? 'Create New Column' : 'Edit Column' }}</h3>
            <button class="close-btn" (click)="closeCreateColumnModal()">&times;</button>
        </div>
        <form [formGroup]="newColumnForm" (ngSubmit)="onSubmitCreateColumn()">
            <div class="modal-body">
                <div class="form-group">
                    <label for="column-name">Column Title</label>
                    <input
                        id="column-name"
                        type="text"
                        formControlName="columnName"
                        placeholder="New Column"
                        class="form-control"
                    />
                </div>
            </div>
            <div class="modal-footer">
                <button type="reset" class="btn-secondary" (click)="closeCreateColumnModal()">
                    Cancel
                </button>
                <button
                    type="submit"
                    class="btn-primary"
                    [disabled]="newColumnForm.invalid || columnsStatus() === 'creating'"
                >
                    @if (columnToEditId() === null) {
                        {{ columnsStatus() === 'creating' ? 'Creating...' : 'Create Board' }}
                    } @else {
                        {{ columnsStatus() === 'updating' ? 'Updating...' : 'Update Column' }}
                    }
                </button>
            </div>
        </form>
    </div>
</div>
